<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo to Coloring Page</title>
<meta name="description" content="Turn a photo into a printable coloring page in your browser. Nothing is uploaded.">
<style>
  :root {
    --bg: #faf9f6; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6a66; --line: #e3e1db;
    --accent: #2f5bd3; --accent-text: #ffffff; --check: #f0eee8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #a09e97; --line: #34332f; --accent: #7c9bff; --accent-text: #0e1220; --check: #2a2a27; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .privacy { display: inline-block; font-size: .9rem; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; padding: 16px; margin: 20px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .controls label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
  .controls label.inline { flex-direction: row; align-items: center; gap: 6px; color: var(--text); font-size: .95rem; }
  select, input[type=range] { font: inherit; color: var(--text); }
  select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  button, .file { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  button.primary, .file { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  .controls label.file { flex-direction: row; color: var(--accent-text); font-size: 1rem; }
  .file input { display: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 220px; display: flex; flex-direction: column; }
  figcaption { font-size: .85rem; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
  .stage { flex: 1; display: grid; place-items: center; border-radius: 8px; background: repeating-conic-gradient(var(--check) 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
  .stage canvas { max-width: 100%; height: auto; display: block; }
  .drop { outline: 2px dashed var(--accent); outline-offset: -8px; }
  .empty { color: var(--muted); padding: 40px 12px; text-align: center; }
  .err { color: #c0392b; }
  footer { margin-top: 32px; color: var(--muted); font-size: .9rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Photo to Coloring Page</h1>
  <p class="sub">Pick a photo and get black-and-white line art you can print and color.</p>
  <span class="privacy">Runs entirely in your browser. Nothing is uploaded.</span>

  <div class="controls">
    <label class="file">Choose photo<input id="file" type="file" accept="image/*"></label>
    <button id="sample" type="button">Try a sample</button>
    <label>Detail
      <select id="detail">
        <option value="low">Low (bold, simple)</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High (more lines)</option>
      </select>
    </label>
    <label>Line weight <input id="weight" type="range" min="0.5" max="3" step="0.25" value="1"></label>
    <label>Edge threshold <input id="threshold" type="range" min="2" max="14" step="0.5" value="5"></label>
    <label>Output size
      <select id="size">
        <option value="same">Same as photo (max 2000 px)</option>
        <option value="2400" selected>Print, 2400 px</option>
        <option value="1200">Small, 1200 px</option>
      </select>
    </label>
    <label class="inline"><input id="invert" type="checkbox"> Invert</label>
    <label class="inline"><input id="transparent" type="checkbox"> Transparent background</label>
    <button id="download" class="primary" type="button" disabled>Download PNG</button>
  </div>

  <div class="grid" id="drop">
    <figure>
      <figcaption><span>Before</span><span id="inInfo"></span></figcaption>
      <div class="stage" id="inStage"><div class="empty">Choose a photo or drop one here.</div></div>
    </figure>
    <figure>
      <figcaption><span>Coloring page</span><span id="outInfo"></span></figcaption>
      <div class="stage" id="outStage"><div class="empty">The result appears here.</div></div>
    </figure>
  </div>

  <footer>
    Open-source, MIT. Source: <code>src/index.js</code>, no dependencies.
    Works best on photos with a clear subject and a simple background.
  </footer>
</main>

<script type="module">
  import { photoToColoringPage, PRESETS } from "../src/index.js";
  import { syntheticScene } from "./synthetic-scene.js";

  const $ = (id) => document.getElementById(id);
  const MAX_INPUT = 2000; // long side we feed to the algorithm
  let source = null;      // { imageData, name }
  let result = null;      // canvas
  let seq = 0;

  // Web Worker keeps the page responsive. Falls back to the main thread if module workers are unavailable.
  let worker = null;
  try { worker = new Worker(new URL("../src/worker.js", import.meta.url), { type: "module" }); } catch { worker = null; }
  function run(img, options) {
    const id = ++seq;
    if (!worker) return Promise.resolve(photoToColoringPage(img, options)).then((r) => ({ id, ...r }));
    return new Promise((resolve, reject) => {
      const on = (e) => {
        if (e.data.id !== id) return;
        worker.removeEventListener("message", on);
        e.data.error ? reject(new Error(e.data.error)) : resolve(e.data);
      };
      worker.addEventListener("message", on);
      const copy = new Uint8ClampedArray(img.data); // keep our copy, transfer this one
      worker.postMessage({ id, data: copy, width: img.width, height: img.height, options }, [copy.buffer]);
    });
  }

  function show(stage, canvas) { stage.replaceChildren(canvas); }
  function toCanvas(data, w, h) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(data), w, h), 0, 0);
    return c;
  }

  async function loadFile(file) {
    if (!file || !file.type.startsWith("image/")) return;
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => null);
    if (!bmp) { $("outStage").innerHTML = '<div class="empty err">Could not read that image. Try a JPG or PNG.</div>'; return; }
    const s = Math.min(1, MAX_INPUT / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    setSource(ctx.getImageData(0, 0, c.width, c.height), file.name.replace(/\.[^.]+$/, "") || "photo");
  }

  function setSource(imageData, name) {
    source = { imageData, name };
    show($("inStage"), toCanvas(imageData.data, imageData.width, imageData.height));
    $("inInfo").textContent = `${imageData.width} × ${imageData.height}`;
    render();
  }

  async function render() {
    if (!source) return;
    const size = $("size").value;
    const options = {
      detail: $("detail").value,
      lineWeight: +$("weight").value,
      threshold: +$("threshold").value,
      invert: $("invert").checked,
      transparent: $("transparent").checked,
      outputSize: size === "same" ? undefined : +size,
    };
    $("outInfo").textContent = "working…";
    $("download").disabled = true;
    const t0 = performance.now();
    try {
      const r = await run(source.imageData, options);
      if (r.id !== seq) return; // a newer render started
      result = toCanvas(r.data, r.width, r.height);
      show($("outStage"), result);
      $("outInfo").textContent = `${r.width} × ${r.height} · ${Math.round(performance.now() - t0)} ms`;
      $("download").disabled = false;
    } catch (e) {
      $("outStage").innerHTML = `<div class="empty err">${String(e.message || e)}</div>`;
      $("outInfo").textContent = "";
    }
  }

  // keep the threshold slider in sync with the chosen preset
  $("detail").addEventListener("change", () => { $("threshold").value = PRESETS[$("detail").value].t; render(); });
  for (const id of ["weight", "threshold", "size", "invert", "transparent"]) $(id).addEventListener("change", render);
  $("file").addEventListener("change", (e) => loadFile(e.target.files[0]));
  $("sample").addEventListener("click", () => {
    const s = syntheticScene(1000, 750);
    setSource(new ImageData(s.data, s.width, s.height), "sample-scene");
  });
  $("download").addEventListener("click", () => {
    if (!result) return;
    result.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${source.name}-coloring-page.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, "image/png");
  });
  const drop = $("drop");
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drop"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("drop"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("drop"); loadFile(e.dataTransfer.files[0]); });
</script>
</body>
</html>
